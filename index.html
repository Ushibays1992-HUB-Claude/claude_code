<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPOスケジュール一覧</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --header-bg: #f3f4f6;
    --row-alt: #fafafa;
    --accent: #2563eb;
    --chip-a: #dcfce7; --chip-a-fg: #166534;
    --chip-b: #fef9c3; --chip-b-fg: #854d0e;
    --chip-c: #ffedd5; --chip-c-fg: #9a3412;
    --chip-d: #fee2e2; --chip-d-fg: #991b1b;
    --chip-mitei: #e5e7eb; --chip-mitei-fg: #374151;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --border: #2a2e37;
      --header-bg: #171a21;
      --row-alt: #14171d;
      --accent: #60a5fa;
      --chip-a: #14532d; --chip-a-fg: #bbf7d0;
      --chip-b: #713f12; --chip-b-fg: #fef08a;
      --chip-c: #7c2d12; --chip-c-fg: #fed7aa;
      --chip-d: #7f1d1d; --chip-d-fg: #fecaca;
      --chip-mitei: #262b34; --chip-mitei-fg: #9ca3af;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  header {
    padding: 24px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    margin: 0 0 4px;
    font-size: 1.4rem;
  }
  .sub {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    padding: 12px 20px;
    align-items: center;
  }
  .controls input, .controls select {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font-size: 0.9rem;
  }
  .controls input[type="search"] {
    min-width: 200px;
  }
  #count {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .table-wrap {
    overflow-x: auto;
    padding: 0 20px 24px;
  }
  table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    min-width: 1400px;
    font-size: 0.85rem;
  }
  th, td {
    box-sizing: border-box;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    white-space: nowrap;
  }
  /* 幅の広くなりがちな列を折り返し表示(単語の途中でも改行、幅は列ごとにJSからインライン指定) */
  .wrap-cell {
    display: block;
    white-space: normal;
  }
  .wrap-head {
    white-space: normal;
    line-height: 1.4;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--header-bg);
    cursor: pointer;
    user-select: none;
    z-index: 1;
  }
  thead th:hover {
    color: var(--accent);
  }
  tbody tr:nth-child(even) {
    background: var(--row-alt);
  }
  /* 上場日/社名/証券コード/評価: 横スクロールしても左に固定表示する列 */
  .sticky-col {
    position: sticky;
    overflow: hidden;
    text-overflow: ellipsis;
    will-change: transform;
  }
  th.sticky-col {
    z-index: 3;
    box-shadow: 1px 0 0 0 var(--header-bg);
  }
  td.sticky-col {
    z-index: 2;
    background: var(--bg);
    box-shadow: 1px 0 0 0 var(--bg);
  }
  tbody tr:nth-child(even) td.sticky-col {
    background: var(--row-alt);
    box-shadow: 1px 0 0 0 var(--row-alt);
  }
  .rank {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.8rem;
  }
  .rank-A { background: var(--chip-a); color: var(--chip-a-fg); }
  .rank-B { background: var(--chip-b); color: var(--chip-b-fg); }
  .rank-C { background: var(--chip-c); color: var(--chip-c-fg); }
  .rank-D { background: var(--chip-d); color: var(--chip-d-fg); }
  .rank-未定 { background: var(--chip-mitei); color: var(--chip-mitei-fg); }
  .flag {
    text-align: center;
    color: var(--accent);
    font-weight: 700;
  }
  .empty {
    padding: 40px 20px;
    color: var(--muted);
    text-align: center;
  }
  a.company-link {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dotted var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>IPOスケジュール一覧</h1>
  <div class="sub" id="updated">読み込み中...</div>
</header>

<div class="controls">
  <input type="search" id="search" placeholder="社名・証券コードで検索">
  <select id="rankFilter">
    <option value="">評価: すべて</option>
  </select>
  <span id="count"></span>
</div>

<div class="table-wrap">
  <table id="tbl">
    <thead><tr id="theadRow"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none">データがありません</div>
</div>

<script>
const COLUMNS = [
  "上場日", "社名", "証券コード", "評価", "予想利益", "業種",
  "仮条件確定日", "ブックビルディング期間", "購入期間",
  "公募株数", "売出株数", "O.A分", "吸収金額", "オファリングレシオ", "当選口数", "仮条件",
  "主幹事証券",
  "SBI証券", "野村證券", "SMBC日興証券", "みずほ証券", "大和証券", "マネックス証券",
  "三菱UFJモルガン・スタンレー証券", "岡三オンライン", "楽天証券", "松井証券",
  "大和コネクト証券", "東海東京証券", "SBIネオトレード証券",
];
const FLAG_COLUMNS = new Set(COLUMNS.slice(17));
// 見出し・データともに指定した幅(px)で折り返し表示する列
const WRAP_WIDTHS = {
  "ブックビルディング期間": 100,
  "購入期間": 100,
  "予想利益": 60,
  "仮条件確定日": 60,
  "公募株数": 60,
  "売出株数": 60,
  "O.A分": 60,
  "吸収金額": 60,
  "オファリングレシオ": 60,
  "当選口数": 60,
  "仮条件": 80,
  "主幹事証券": 80,
};

// 横スクロールしても左に固定表示する列(幅と左端からの位置をここで管理)
const STICKY_WIDTHS = { "上場日": 110, "社名": 180, "証券コード": 80, "評価": 60 };
const STICKY_COLUMNS = Object.keys(STICKY_WIDTHS);
const STICKY_LEFT = {};
(() => {
  let acc = 0;
  STICKY_COLUMNS.forEach(col => {
    STICKY_LEFT[col] = acc;
    acc += STICKY_WIDTHS[col];
  });
})();

let rows = [];
let sortKey = "上場日";
let sortAsc = true;

function parseDate(s) {
  if (!s) return [9999, 99, 99];
  const m = s.match(/(?:(\d{4})\/)?(\d{1,2})\/(\d{1,2})/);
  if (!m) return [9999, 99, 99];
  return [m[1] ? +m[1] : 0, +m[2], +m[3]];
}

function renderHead() {
  const tr = document.getElementById("theadRow");
  tr.innerHTML = "";
  COLUMNS.forEach(col => {
    const th = document.createElement("th");
    const arrow = sortKey === col ? (sortAsc ? " ▲" : " ▼") : "";
    if (WRAP_WIDTHS[col]) {
      th.classList.add("wrap-head");
      th.style.width = WRAP_WIDTHS[col] + "px";
    }
    if (STICKY_WIDTHS[col]) {
      th.classList.add("sticky-col");
      th.style.width = STICKY_WIDTHS[col] + "px";
      th.style.left = STICKY_LEFT[col] + "px";
    }
    th.textContent = col + arrow;
    th.addEventListener("click", () => {
      if (sortKey === col) { sortAsc = !sortAsc; } else { sortKey = col; sortAsc = true; }
      render();
    });
    tr.appendChild(th);
  });
}

function rankClass(v) {
  if (!v) return "";
  if (v.startsWith("A")) return "rank-A";
  if (v.startsWith("B")) return "rank-B";
  if (v.startsWith("C")) return "rank-C";
  if (v.startsWith("D")) return "rank-D";
  return "rank-未定";
}

function render() {
  renderHead();
  const q = document.getElementById("search").value.trim().toLowerCase();
  const rankVal = document.getElementById("rankFilter").value;

  let filtered = rows.filter(r => {
    if (rankVal && r["評価"] !== rankVal) return false;
    if (!q) return true;
    return (r["社名"] || "").toLowerCase().includes(q) || (r["証券コード"] || "").toLowerCase().includes(q);
  });

  filtered.sort((a, b) => {
    let av = a[sortKey] || "", bv = b[sortKey] || "";
    if (sortKey === "上場日") {
      const [ay, am, ad] = parseDate(av), [by, bm, bd] = parseDate(bv);
      av = ay * 10000 + am * 100 + ad;
      bv = by * 10000 + bm * 100 + bd;
    }
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  filtered.forEach(r => {
    const tr = document.createElement("tr");
    COLUMNS.forEach(col => {
      const td = document.createElement("td");
      const val = r[col] || "";
      if (STICKY_WIDTHS[col]) {
        td.classList.add("sticky-col");
        td.style.width = STICKY_WIDTHS[col] + "px";
        td.style.left = STICKY_LEFT[col] + "px";
      }
      if (col === "評価") {
        td.innerHTML = `<span class="rank ${rankClass(val)}">${val || "未定"}</span>`;
      } else if (col === "社名") {
        const code = r["証券コード"];
        td.title = val;
        if (code) {
          td.innerHTML = `<a class="company-link" href="https://ipokabu.net/ipo/${encodeURIComponent(code)}" target="_blank" rel="noopener">${val}</a>`;
        } else {
          td.textContent = val;
        }
      } else if (FLAG_COLUMNS.has(col)) {
        td.classList.add("flag");
        td.textContent = val === "1" ? "●" : "";
      } else if (WRAP_WIDTHS[col]) {
        const div = document.createElement("div");
        div.className = "wrap-cell";
        div.style.width = WRAP_WIDTHS[col] + "px";
        div.textContent = val;
        td.appendChild(div);
      } else {
        td.textContent = val;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  document.getElementById("count").textContent = `${filtered.length} / ${rows.length} 件`;
  document.getElementById("emptyMsg").style.display = filtered.length ? "none" : "block";
}

function populateRankFilter() {
  const sel = document.getElementById("rankFilter");
  const ranks = [...new Set(rows.map(r => r["評価"]).filter(Boolean))].sort();
  ranks.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r;
    opt.textContent = "評価: " + r;
    sel.appendChild(opt);
  });
}

async function load() {
  try {
    const res = await fetch("ipo.json?_=" + Date.now());
    if (!res.ok) throw new Error(res.status);
    rows = await res.json();
    document.getElementById("updated").textContent =
      `${rows.length}件のIPO銘柄データ（このページを開いた時点でipo.jsonを読み込んでいます）`;
    populateRankFilter();
    render();
  } catch (e) {
    document.getElementById("updated").textContent = "ipo.json の読み込みに失敗しました: " + e;
  }
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("rankFilter").addEventListener("change", render);

load();
</script>

</body>
</html>
