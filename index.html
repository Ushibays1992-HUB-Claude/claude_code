<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IPOスケジュール一覧</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --header-bg: #f3f4f6;
    --row-alt: #fafafa;
    --col-alt: #f6fbf6;
    --col-alt-gray: #f0f0f0;
    --accent: #2563eb;
    --chip-s: #fee2e2; --chip-s-fg: #b91c1c;
    --chip-a: #fce7f3; --chip-a-fg: #9d174d;
    --chip-b: #fef9c3; --chip-b-fg: #854d0e;
    --chip-c: #ffedd5; --chip-c-fg: #9a3412;
    --chip-d: #dbeafe; --chip-d-fg: #1e3a8a;
    --chip-mitei: #e5e7eb; --chip-mitei-fg: #374151;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #e5e7eb;
      --muted: #9ca3af;
      --border: #2a2e37;
      --header-bg: #171a21;
      --row-alt: #14171d;
      --col-alt: #12241a;
      --col-alt-gray: #1a1d24;
      --accent: #60a5fa;
      --chip-s: #7f1d1d; --chip-s-fg: #fecaca;
      --chip-a: #831843; --chip-a-fg: #fbcfe8;
      --chip-b: #713f12; --chip-b-fg: #fef08a;
      --chip-c: #7c2d12; --chip-c-fg: #fed7aa;
      --chip-d: #1e3a8a; --chip-d-fg: #bfdbfe;
      --chip-mitei: #262b34; --chip-mitei-fg: #9ca3af;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
  }
  h1 {
    margin: 0;
    font-size: 1rem;
  }
  .sub {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .controls {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-left: auto;
  }
  .controls input, .controls select {
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font-size: 0.9rem;
  }
  .controls input[type="search"] {
    min-width: 200px;
  }
  #count {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .table-wrap {
    flex: 1 1 auto;
    min-height: 0;
    overflow-x: auto;
    overflow-y: auto;
    padding: 0 20px 24px;
  }
  table {
    table-layout: fixed;
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    min-width: 1400px;
    font-size: 0.85rem;
  }
  th, td {
    box-sizing: border-box;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    white-space: nowrap;
  }
  /* 幅の広くなりがちな列を折り返し表示(単語の途中でも改行、幅は列ごとにJSからインライン指定) */
  .wrap-cell {
    display: block;
    white-space: normal;
  }
  .wrap-cell.small-text {
    font-size: 0.75em;
  }
  .wrap-head {
    white-space: normal;
    line-height: 1.4;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--header-bg);
    cursor: pointer;
    user-select: none;
    z-index: 1;
  }
  thead th:hover {
    color: var(--accent);
  }
  /* 列ごとに白と薄緑を交互に(列の境目を分かりやすくする) */
  tbody td:nth-child(odd) {
    background: var(--bg);
  }
  tbody td:nth-child(even) {
    background: var(--col-alt);
  }
  /* 上場日/社名/証券コード/評価: 横スクロールしても左に固定表示する列 */
  .sticky-col {
    position: sticky;
    overflow: hidden;
    text-overflow: ellipsis;
    will-change: transform;
  }
  th.sticky-col {
    z-index: 3;
    box-shadow: 1px 0 0 0 var(--header-bg);
  }
  td.sticky-col {
    z-index: 2;
  }
  td.sticky-col:nth-child(odd) {
    box-shadow: 1px 0 0 0 var(--bg);
  }
  td.sticky-col:nth-child(even) {
    box-shadow: 1px 0 0 0 var(--col-alt);
  }
  .rank {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.8rem;
  }
  .rank-S { background: var(--chip-s); color: var(--chip-s-fg); font-weight: 800; }
  .rank-A { background: var(--chip-a); color: var(--chip-a-fg); font-weight: 800; }
  .rank-B { background: var(--chip-b); color: var(--chip-b-fg); }
  .rank-C { background: var(--chip-c); color: var(--chip-c-fg); }
  .rank-D { background: var(--chip-d); color: var(--chip-d-fg); }
  .rank-未定 { background: var(--chip-mitei); color: var(--chip-mitei-fg); }
  .flag {
    text-align: center;
    color: var(--accent);
    font-weight: 700;
    padding: 4px !important;
  }
  /* 証券会社列(SBI証券〜SBIネオトレード証券)は白/薄灰色の縞にする */
  td.flag:nth-child(odd) {
    background: var(--bg);
  }
  td.flag:nth-child(even) {
    background: var(--col-alt-gray);
  }
  .status-btn {
    width: 100%;
    font-size: 0.68rem;
    padding: 4px 2px;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--fg);
    background-color: var(--bg);
    cursor: pointer;
    font-family: inherit;
  }
  .status-btn:hover {
    border-color: var(--accent);
  }
  .empty {
    padding: 40px 20px;
    color: var(--muted);
    text-align: center;
  }
  a.company-link {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dotted var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>IPOスケジュール一覧</h1>
  <div class="sub" id="updated">読み込み中...</div>
  <div class="controls">
    <input type="search" id="search" placeholder="社名・証券コードで検索">
    <select id="rankFilter">
      <option value="">評価: すべて</option>
      <option value="S">評価: S</option>
      <option value="A">評価: A</option>
      <option value="B">評価: B</option>
      <option value="C">評価: C</option>
      <option value="D">評価: D</option>
      <option value="未定">評価: 未定</option>
    </select>
    <span id="count"></span>
  </div>
</header>

<div class="table-wrap">
  <table id="tbl">
    <thead><tr id="theadRow"></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="emptyMsg" style="display:none">データがありません</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, setDoc, collection, onSnapshot,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrusPyhyhKLz2CJF0Hocqlx8qA_ej5UvE",
  authDomain: "ipo-kanri-project.firebaseapp.com",
  projectId: "ipo-kanri-project",
  storageBucket: "ipo-kanri-project.firebasestorage.app",
  messagingSenderId: "777241953394",
  appId: "1:777241953394:web:3bd012cc2d714022bb2eeb",
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

// 申込ステータス管理: 証券コード×証券会社 ごとにFirestoreへ保存し、複数PCで共有する
const STATUS_OPTIONS = ["申込前", "申込中", "落選", "補欠", "当選"];
const STATUS_COLORS = {
  "申込前": "",
  "申込中": "#3b82f6",
  "落選": "#ef4444",
  "補欠": "#22c55e",
  "当選": "#d4af37",
};
const STATUS_TEXT_COLORS = {
  "申込前": "",
  "申込中": "#ffffff",
  "落選": "#ffffff",
  "補欠": "#ffffff",
  "当選": "#3a2e00",
};
const statusMap = {};

function statusKey(code, broker) {
  return `${code}__${broker}`;
}

onSnapshot(collection(db, "statuses"), (snap) => {
  snap.docChanges().forEach(change => {
    if (change.type === "removed") {
      delete statusMap[change.doc.id];
    } else {
      statusMap[change.doc.id] = change.doc.data().status || "申込前";
    }
  });
  if (rows.length) render();
});

function setStatus(code, broker, status) {
  const key = statusKey(code, broker);
  statusMap[key] = status;
  setDoc(doc(db, "statuses", key), { status, code, broker }, { merge: true })
    .catch(e => console.error("ステータス保存に失敗しました", e));
}

const COLUMNS = [
  "上場日", "社名", "証券コード", "評価", "予想利益", "業種",
  "仮条件確定日", "ブックビルディング期間", "購入期間",
  "公募株数", "売出株数", "吸収金額", "当選口数", "仮条件",
  "主幹事証券",
  "SBI証券", "野村證券", "SMBC日興証券", "みずほ証券", "大和証券", "マネックス証券",
  "三菱UFJモルガン・スタンレー証券", "岡三オンライン", "楽天証券", "松井証券",
  "大和コネクト証券", "東海東京証券", "SBIネオトレード証券",
];
const FLAG_COLUMNS = new Set(COLUMNS.slice(15));
// 証券会社名の見出し表示用の短縮ラベル(データのキー名はCOLUMNSのフル名称のまま)
const HEADER_LABELS = {
  "ブックビルディング期間": "BB期間",
  "SBI証券": "SBI",
  "野村證券": "野村",
  "SMBC日興証券": "SMBC日興",
  "みずほ証券": "みずほ",
  "大和証券": "大和",
  "マネックス証券": "マネックス",
  "三菱UFJモルガン・スタンレー証券": "三菱UFJMS",
  "岡三オンライン": "岡三オンライン",
  "楽天証券": "楽天",
  "松井証券": "松井",
  "大和コネクト証券": "大和コネクト",
  "東海東京証券": "東海東京",
  "SBIネオトレード証券": "SBIネオ",
};
// 見出し・データともに指定した幅(px)で折り返し表示する列
const WRAP_WIDTHS = {
  "業種": 100,
  "ブックビルディング期間": 120,
  "購入期間": 100,
  "予想利益": 90,
  "仮条件確定日": 90,
  "公募株数": 90,
  "売出株数": 90,
  "吸収金額": 120,
  "当選口数": 60,
  "仮条件": 140,
  "主幹事証券": 90,
};
// table-layout:fixed では全列に幅指定が必要なため、証券会社フラグ列にも幅を設定する
FLAG_COLUMNS.forEach(col => { WRAP_WIDTHS[col] = 60; });

// 横スクロールしても左に固定表示する列(幅と左端からの位置をここで管理)
const STICKY_WIDTHS = { "上場日": 110, "社名": 180, "証券コード": 80, "評価": 70 };
const STICKY_COLUMNS = Object.keys(STICKY_WIDTHS);
const STICKY_LEFT = {};
(() => {
  let acc = 0;
  STICKY_COLUMNS.forEach(col => {
    STICKY_LEFT[col] = acc;
    acc += STICKY_WIDTHS[col];
  });
})();

let rows = [];
let sortKey = "上場日";
let sortAsc = true;

// WEB表示のみを簡略化する(元データ・CSV/JSONは変更しない)
function formatDisplay(col, val) {
  if (!val) return val;
  if (col === "吸収金額") {
    return val.replace(/あたり/g, "");
  }
  if (col === "仮条件") {
    return val
      .replace(/(.+?)に決定（想定価格は(.+?)）/, "$1（$2）")
      .replace(/抽選資金：/g, "");
  }
  if (col === "公募株数" || col === "売出株数") {
    return val.replace(/株$/, "");
  }
  if (col === "当選口数") {
    return val.replace(/口$/, "");
  }
  return val;
}

function parseDate(s) {
  if (!s) return [9999, 99, 99];
  const m = s.match(/(?:(\d{4})\/)?(\d{1,2})\/(\d{1,2})/);
  if (!m) return [9999, 99, 99];
  return [m[1] ? +m[1] : 0, +m[2], +m[3]];
}

function renderHead() {
  const tr = document.getElementById("theadRow");
  tr.innerHTML = "";
  COLUMNS.forEach(col => {
    const th = document.createElement("th");
    const arrow = sortKey === col ? (sortAsc ? " ▲" : " ▼") : "";
    if (WRAP_WIDTHS[col]) {
      th.classList.add("wrap-head");
      th.style.width = WRAP_WIDTHS[col] + "px";
    }
    if (STICKY_WIDTHS[col]) {
      th.classList.add("sticky-col");
      th.style.width = STICKY_WIDTHS[col] + "px";
      th.style.left = STICKY_LEFT[col] + "px";
    }
    th.textContent = (HEADER_LABELS[col] || col) + arrow;
    th.title = col;
    th.addEventListener("click", () => {
      if (sortKey === col) { sortAsc = !sortAsc; } else { sortKey = col; sortAsc = true; }
      render();
    });
    tr.appendChild(th);
  });
}

function rankClass(v) {
  if (!v) return "";
  if (v.startsWith("S")) return "rank-S";
  if (v.startsWith("A")) return "rank-A";
  if (v.startsWith("B")) return "rank-B";
  if (v.startsWith("C")) return "rank-C";
  if (v.startsWith("D")) return "rank-D";
  return "rank-未定";
}

function render() {
  renderHead();
  const q = document.getElementById("search").value.trim().toLowerCase();
  const rankVal = document.getElementById("rankFilter").value;

  let filtered = rows.filter(r => {
    if (rankVal && r["評価"] !== rankVal) return false;
    if (!q) return true;
    return (r["社名"] || "").toLowerCase().includes(q) || (r["証券コード"] || "").toLowerCase().includes(q);
  });

  filtered.sort((a, b) => {
    let av = a[sortKey] || "", bv = b[sortKey] || "";
    if (sortKey === "上場日") {
      const [ay, am, ad] = parseDate(av), [by, bm, bd] = parseDate(bv);
      av = ay * 10000 + am * 100 + ad;
      bv = by * 10000 + bm * 100 + bd;
    }
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  filtered.forEach(r => {
    const tr = document.createElement("tr");
    COLUMNS.forEach(col => {
      const td = document.createElement("td");
      const val = r[col] || "";
      if (STICKY_WIDTHS[col]) {
        td.classList.add("sticky-col");
        td.style.width = STICKY_WIDTHS[col] + "px";
        td.style.left = STICKY_LEFT[col] + "px";
      }
      if (col === "評価") {
        td.style.textAlign = "center";
        td.innerHTML = `<span class="rank ${rankClass(val)}">${val || "未定"}</span>`;
      } else if (col === "社名") {
        const code = r["証券コード"];
        td.title = val;
        if (code) {
          td.innerHTML = `<a class="company-link" href="https://ipokabu.net/ipo/${encodeURIComponent(code)}" target="_blank" rel="noopener">${val}</a>`;
        } else {
          td.textContent = val;
        }
      } else if (FLAG_COLUMNS.has(col)) {
        td.classList.add("flag");
        if (val === "1") {
          const code = r["証券コード"];
          const key = statusKey(code, col);
          const current = statusMap[key] || "申込前";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "status-btn";
          btn.textContent = current;
          btn.style.background = STATUS_COLORS[current] || "";
          btn.style.color = STATUS_TEXT_COLORS[current] || "";
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const idx = STATUS_OPTIONS.indexOf(btn.textContent);
            const next = STATUS_OPTIONS[(idx + 1) % STATUS_OPTIONS.length];
            btn.textContent = next;
            btn.style.background = STATUS_COLORS[next] || "";
            btn.style.color = STATUS_TEXT_COLORS[next] || "";
            setStatus(code, col, next);
          });
          td.appendChild(btn);
        }
      } else if (WRAP_WIDTHS[col]) {
        const div = document.createElement("div");
        div.className = "wrap-cell";
        if (col === "主幹事証券") div.classList.add("small-text");
        div.textContent = formatDisplay(col, val);
        td.appendChild(div);
      } else {
        td.textContent = val;
      }
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  document.getElementById("count").textContent = `${filtered.length} / ${rows.length} 件`;
  document.getElementById("emptyMsg").style.display = filtered.length ? "none" : "block";
}

async function load() {
  try {
    const res = await fetch("ipo.json?_=" + Date.now());
    if (!res.ok) throw new Error(res.status);
    rows = await res.json();
    document.getElementById("updated").textContent = `${rows.length}件のIPO銘柄データ`;
    render();
  } catch (e) {
    document.getElementById("updated").textContent = "ipo.json の読み込みに失敗しました: " + e;
  }
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("rankFilter").addEventListener("change", render);

load();
</script>

</body>
</html>
